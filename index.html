<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    overflow: hidden;

    background:
        radial-gradient(circle at center, #17191e 0%, #0b0c0f 75%);

    color: white;

    font-family: Arial, Helvetica, sans-serif;

}


/* =========================
   ÁREA DO MAPA
========================= */

#viewport {

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    cursor: grab;

    position: relative;

}


#viewport.dragging {

    cursor: grabbing;

}


#shop {

    position: absolute;

    width: 1900px;
    height: 1500px;

    transform-origin: 0 0;

}


/* =========================
   FUNDO / GRADE
========================= */

#shop::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    pointer-events: none;

}


/* =========================
   CATEGORIAS
========================= */

.category {

    position: absolute;

    top: 60px;

    width: 500px;

    height: 1360px;

}


.category-title {

    position: absolute;

    top: -45px;

    left: 0;

    width: 100%;

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    letter-spacing: 3px;

    text-transform: uppercase;

}


.category-balistico {

    left: 70px;

}


.category-espiritual {

    left: 700px;

}


.category-vitalidade {

    left: 1330px;

}


.category-balistico .category-title {

    color: #d95353;

}


.category-espiritual .category-title {

    color: #a76de8;

}


.category-vitalidade .category-title {

    color: #63c878;

}


/* =========================
   TIERS
========================= */

.tier {

    position: absolute;

    left: 0;

    width: 100%;

    height: 1px;

    background: rgba(255,255,255,0.12);

}


.tier::before {

    content: attr(data-tier);

    position: absolute;

    left: 8px;

    top: -18px;

    font-size: 11px;

    color: rgba(255,255,255,0.3);

    letter-spacing: 2px;

}


.tier-1 {
    top: 1100px;
}


.tier-2 {
    top: 800px;
}


.tier-3 {
    top: 500px;
}


.tier-4 {
    top: 200px;
}


/* =========================
   ÁREA DE CONEXÕES
========================= */

.connections {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

    overflow: visible;

}


.connection {

    fill: none;

    stroke-width: 3;

    opacity: 0.65;

}


.connection-balistico {

    stroke: #d95353;

}


.connection-vitalidade {

    stroke: #63c878;

}


.connection-espiritual {

    stroke: #a76de8;

}


/* =========================
   ITENS
========================= */

.item {

    position: absolute;

    width: 86px;
    height: 86px;

    border-radius: 50%;

    transform: translate(-50%, -50%);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;

    z-index: 10;

}


.item:hover {

    transform: translate(-50%, -50%) scale(1.12);

    filter: brightness(1.25);

}


.item::before {

    content: "";

    position: absolute;

    inset: -5px;

    border-radius: 50%;

    z-index: -1;

}


.item-balistico {

    background:
        radial-gradient(
            circle,
            #292020 0%,
            #120e0e 75%
        );

    border: 2px solid #d95353;

}


.item-balistico::before {

    border: 1px solid rgba(217,83,83,0.3);

}


.item-espiritual {

    background:
        radial-gradient(
            circle,
            #24202b 0%,
            #110e15 75%
        );

    border: 2px solid #a76de8;

}


.item-espiritual::before {

    border: 1px solid rgba(167,109,232,0.3);

}


.item-vitalidade {

    background:
        radial-gradient(
            circle,
            #202a22 0%,
            #0d120e 75%
        );

    border: 2px solid #63c878;

}


.item-vitalidade::before {

    border: 1px solid rgba(99,200,120,0.3);

}


.item img {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

}


.item-name {

    position: absolute;

    top: 91px;

    left: 50%;

    transform: translateX(-50%);

    width: 140px;

    text-align: center;

    font-size: 12px;

    line-height: 15px;

    color: rgba(255,255,255,0.8);

    pointer-events: none;

}


/* =========================
   TOOLTIP
========================= */

.tooltip {

    position: fixed;

    width: 260px;

    padding: 14px;

    background: rgba(13,14,18,0.97);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 8px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.5);

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.1s ease;

    z-index: 1000;

}


.tooltip.visible {

    opacity: 1;

}


.tooltip-name {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 5px;

}


.tooltip-type {

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 10px;

    opacity: 0.6;

}


.tooltip-description {

    font-size: 13px;

    line-height: 18px;

    color: rgba(255,255,255,0.8);

}


/* =========================
   CONTROLES
========================= */

.controls {

    position: fixed;

    right: 20px;
    bottom: 20px;

    display: flex;

    flex-direction: column;

    gap: 6px;

    z-index: 2000;

}


.controls button {

    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 6px;

    background: #15171b;

    color: white;

    font-size: 20px;

    cursor: pointer;

}


.controls button:hover {

    background: #24272d;

}


/* =========================
   TIER LABEL CENTRAL
========================= */

.tier-label {

    position: absolute;

    left: -60px;

    width: 40px;

    text-align: center;

    font-size: 11px;

    color: rgba(255,255,255,0.35);

}

</style>

</head>

/* =========================================================

   como Vida Adicional → Colosso.

========================================================= */


const conexoes = [

    {
        de: "headshot",
        para: "disorienting_shot",
        tipo: "Balístico",
        corredor: "direita"

/* =========================================================
   CRIAÇÃO DAS CATEGORIAS
========================================================= */


const shop = document.getElementById("shop");


const categorias = {

    "Balístico": "category-balistico",

    "Espiritual": "category-espiritual",

    "Vitalidade": "category-vitalidade"

};


for (const [nome, classe] of Object.entries(categorias)) {

    const category = document.createElement("div");

    category.className = `category ${classe}`;

    category.dataset.tipo = nome;


    const title = document.createElement("div");

    title.className = "category-title";

    title.textContent = nome;


    category.appendChild(title);


    for (let tier = 1; tier <= 4; tier++) {

        const linha = document.createElement("div");

        linha.className = `tier tier-${tier}`;

        linha.dataset.tier = `TIER ${tier}`;


        category.appendChild(linha);

    }


    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.classList.add("connections");

    svg.setAttribute("viewBox", "0 0 500 1360");

    svg.dataset.tipo = nome;


    category.appendChild(svg);


    shop.appendChild(category);

}


/* =========================================================
   CRIAÇÃO DOS ITENS
========================================================= */


const itemElements = {};


itens.forEach(item => {

    const category = document.querySelector(
        `.category[data-tipo="${item.tipo}"]`
    );


    const element = document.createElement("div");

    element.className =
        `item item-${item.tipo.toLowerCase()}`;


    element.style.left = `${item.x}px`;

    element.style.top = `${item.y}px`;


    element.dataset.id = item.id;


    const img = document.createElement("img");

    img.src = item.imagem;

    img.alt = item.nome;


    const name = document.createElement("div");

    name.className = "item-name";

    name.textContent = item.nome;


    element.appendChild(img);

    element.appendChild(name);


    category.appendChild(element);


    itemElements[item.id] = element;


    /* =========================
       TOOLTIP
    ========================= */

    element.addEventListener("mouseenter", () => {

        const tooltip =
            document.getElementById("tooltip");

        document.getElementById("tooltip-name")
            .textContent = item.nome;

        document.getElementById("tooltip-type")
            .textContent =
                `${item.tipo} · Tier ${item.tier}`;

        document.getElementById("tooltip-description")
            .textContent =
                item.descricao ||
                "Descrição ainda não definida.";


        tooltip.classList.add("visible");

    });


    element.addEventListener("mousemove", event => {

        const tooltip =
            document.getElementById("tooltip");


        let x = event.clientX + 18;

        let y = event.clientY + 18;


        if (x + 260 > window.innerWidth) {

            x = event.clientX - 278;

        }


        if (y + 160 > window.innerHeight) {

            y = event.clientY - 160;

        }


        tooltip.style.left = `${x}px`;

        tooltip.style.top = `${y}px`;

    });


    element.addEventListener("mouseleave", () => {

        document
            .getElementById("tooltip")
            .classList.remove("visible");

    });

});


/* =========================================================
   CONEXÕES
========================================================= */


function criarConexao(conexao) {

    const origem = itens.find(
        item => item.id === conexao.de
    );

    const destino = itens.find(
        item => item.id === conexao.para
    );


    if (!origem || !destino) return;


    const category =
        document.querySelector(
            `.category[data-tipo="${conexao.tipo}"]`
        );


    const svg =
        category.querySelector(".connections");


    /*
       Cada conexão recebe um corredor diferente.

       Isso é especialmente importante para conexões
       que atravessam vários Tiers.
    */

    let corridorX;


    if (conexao.corredor === "esquerda") {

        corridorX = 35;

    } else {

        corridorX = 465;

    }


    /*
       O caminho é ortogonal:

       ITEM
         |
         |
       CORREDOR
         |
         |
       ITEM

       Dessa forma a linha nunca fica diagonal
       atravessando os itens intermediários.
    */


    const x1 = origem.x;

    const y1 = origem.y;

    const x2 = destino.x;

    const y2 = destino.y;


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const d = `

        M ${x1} ${y1}

        L ${corridorX} ${y1}

        L ${corridorX} ${y2}

        L ${x2} ${y2}

    `;


    path.setAttribute("d", d);

    path.classList.add(
        "connection",
        `connection-${conexao.tipo.toLowerCase()}`
    );


    svg.appendChild(path);

}

   As conexões são desenhadas depois dos itens.
*/


conexoes.forEach(criarConexao);


/* =========================================================
   ZOOM / MOVIMENTO
========================================================= */


let scale = 0.75;

let posX = 0;

let posY = 0;

let dragging = false;

let startX = 0;

let startY = 0;


function atualizarMapa() {

    shop.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;

}


document
    .getElementById("zoom-in")
    .addEventListener("click", () => {

        scale = Math.min(
            2,
            scale + 0.1
        );

        atualizarMapa();

    });


document
    .getElementById("zoom-out")
    .addEventListener("click", () => {

        scale = Math.max(
            0.5,
            scale - 0.1
        );

        atualizarMapa();

    });


/* =========================
   ARRASTAR
========================= */


const viewport =
    document.getElementById("viewport");


viewport.addEventListener(
    "mousedown",
    event => {

        if (event.target.closest(".item")) {

            return;

        }


        dragging = true;

        viewport.classList.add("dragging");


        startX =
            event.clientX - posX;

        startY =
            event.clientY - posY;

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (!dragging) return;


        posX =
            event.clientX - startX;

        posY =
            event.clientY - startY;


        atualizarMapa();

    }
);


window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

        viewport.classList.remove("dragging");

    }
);


/* =========================
   ZOOM COM RODA DO MOUSE
========================= */


viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (event.deltaY < 0) {

            scale += 0.08;

        } else {

            scale -= 0.08;

        }


        scale =
            Math.max(
                0.5,
                Math.min(2, scale)
            );


        atualizarMapa();

    },
    { passive: false }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */


atualizarMapa();


</script>
